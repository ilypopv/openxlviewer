<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="xl">
  <!-- Flat, geometric monogram on a dark plum tile: x (two crossing bars) + l (one bar) -->
  <rect width="256" height="256" rx="56" fill="#261230"/>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g fill="none" stroke-width="28" stroke-linecap="round">
    <!-- x: back bar, then front bar on top -->
    <path d="M142 114 78 178" stroke="#B79CFF"/>
    <path d="M78 114 142 178" stroke="#D7FF64"/>
    <!-- l -->
    <path d="M178 78v100" stroke="#8B6CFF"/>
  </g>
</svg>
